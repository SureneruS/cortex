[package]
name = "nova-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "nova_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "nova-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
