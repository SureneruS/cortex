version: 1
type: knowledge
fields:
  title:
    type: string
    required: true
    description: Short descriptive title
  summary:
    type: string
    required: true
    description: One-line summary for injection (like skill descriptions)
  repos:
    type: list[string]
    required: true
    description: Repositories this knowledge applies to
  tags:
    type: list[string]
    required: false
    description: Searchable tags
  pattern_type:
    type: string
    required: false
    description: "Type of knowledge: pattern, gotcha, decision, or convention"
    enum: [pattern, gotcha, decision, convention]
  confidence:
    type: string
    required: false
    description: "How confident we are in this knowledge: high (multiple sources, verified), medium (single source, clear signal), low (inferred, may need validation)"
    enum: [high, medium, low]
  sources:
    type: list[string]
    required: true
    description: Capture filenames that contributed to this knowledge
  created_at:
    type: datetime
    required: true
    description: ISO 8601 timestamp of creation
  schema_version:
    type: integer
    required: true
    description: Schema version number
