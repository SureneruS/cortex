[project]
name = "nova"
version = "0.1.0"
description = "Memory system for Claude Code sessions — capture, inject, dream"
requires-python = ">=3.13"
dependencies = [
    "pyyaml",
    "slack-sdk",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "ty"
]

[project.scripts]
nova-session-start = "nova.hooks.session_start:main"
nova-user-prompt = "nova.hooks.user_prompt:main"
nova-transcripts = "nova.cli.transcripts:main"
nova-notification = "nova.hooks.notification:main"
nova-setup = "nova.setup:main"
nova = "nova.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
src = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.2",
    "ty>=0.0.18",
]
