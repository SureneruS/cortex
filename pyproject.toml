[project]
name = "cortex"
dynamic = ["version"]
description = "Companion brain for Claude Code — persistent context, session orchestration, memory"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]",
    "click",
    "textual",
    "sentence-transformers",
    "onnxruntime",
    "sqlite-vec",
    "fastapi",
    "uvicorn[standard]",
    "pymongo>=4.6",
    "httpx>=0.28",
    "croniter>=1.3",
    "structlog>=24.1",
    "pyyaml",
    "slack-sdk",
]

[project.scripts]
cortex = "cortex.cli:cli"
cortex-mcp = "cortex.server:main"
cortex-hook-session-start = "nova.hooks.session_start:main"
cortex-hook-user-prompt = "nova.hooks.user_prompt:main"
cortex-hook-pre-compact = "nova.hooks.pre_compact:main"
cortex-hook-stop = "nova.hooks.stop:main"
cortex-hook-stop-failure = "nova.hooks.stop_failure:main"
cortex-hook-session-end = "nova.hooks.session_end:main"
cortex-hook-subagent-start = "nova.hooks.subagent_start:main"
cortex-hook-subagent-stop = "nova.hooks.subagent_stop:main"
cortex-hook-task-created = "nova.hooks.task_created:main"
cortex-hook-task-completed = "nova.hooks.task_completed:main"
cortex-hook-post-compact = "nova.hooks.post_compact:main"
cortex-hook-workflow-file = "nova.hooks.workflow_file:main"
nova-session-start = "nova.hooks.session_start:main"
nova-user-prompt = "nova.hooks.user_prompt:main"
nova-transcripts = "nova.cli.transcripts:main"
nova-notification = "nova.hooks.notification:main"
nova-setup = "nova.setup:main"
nova = "nova.cli.main:main"
nova-pre-compact = "nova.hooks.pre_compact:main"
arc-mcp = "nova.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "cortex/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["cortex", "python/src/nova"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "python/tests"]
addopts = "-m 'not e2e'"
markers = [
    "slice0: Slice 0 — test harness self-tests",
    "slice1: Slice 1 — repo-based session tests",
    "slice2: Slice 2 — spatial spawn + layout tests",
    "slice3: Slice 3 — session lifecycle (pause/resume/hide/show) tests",
    "slice4: Slice 4 — layout control (gather/scatter/move) tests",
    "e2e: End-to-end tests using real stack (MongoDB, tmux, CC)",
]

[tool.ruff]
target-version = "py311"
src = ["cortex", "python/src"]
