[project]
name = "cortex"
version = "0.2.0"
description = "Companion brain for Claude Code — persistent context, session orchestration, memory"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]",
    "click",
    "textual",
    "sentence-transformers",
    "sqlite-vec",
    "fastapi",
    "uvicorn[standard]",
    "pymongo>=4.6",
    "httpx>=0.28",
    "croniter>=1.3",
    "structlog>=24.1",
    "pyyaml",
    "slack-sdk",
]

[project.scripts]
cortex = "cortex.cli:cli"
cortex-mcp = "cortex.server:main"
cortex-hook-session-start = "nova.hooks.session_start:main"
cortex-hook-user-prompt = "nova.hooks.user_prompt:main"
cortex-hook-pre-compact = "nova.hooks.pre_compact:main"
nova-session-start = "nova.hooks.session_start:main"
nova-user-prompt = "nova.hooks.user_prompt:main"
nova-transcripts = "nova.cli.transcripts:main"
nova-notification = "nova.hooks.notification:main"
nova-setup = "nova.setup:main"
nova = "nova.cli.main:main"
nova-pre-compact = "nova.hooks.pre_compact:main"
arc-mcp = "nova.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cortex", "python/src/nova"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "python/tests"]

[tool.ruff]
target-version = "py311"
src = ["cortex", "python/src"]
